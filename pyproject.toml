[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "streaming-voice-assistant"
version = "0.2.0"
description = "Half-duplex voice assistant with streaming audio, transcription, and speech synthesis"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<1.0",
    "uvicorn[standard]>=0.30,<1.0",
    "pydantic>=2.10,<3.0",
    "openai>=3.24,<4.0",
    "python-dotenv>=1.2,<2.0",
    "websockets>=14,<18",
    "sounddevice>=0.5,<0.6",
]

[project.optional-dependencies]
test = [
    "httpx>=0.27,<1.0",
    "pytest>=8.0,<9.0",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
